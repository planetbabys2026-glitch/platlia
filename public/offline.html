<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Platlia</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #12171a;
        --muted: #59656d;
        --brand: #1d4e51;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101416;
          --fg: #f4f6f7;
          --muted: #9aa5ab;
          --brand: #3e9ea2;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 0;
        font-size: 1.375rem;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.625rem 1.25rem;
        border: none;
        border-radius: 0.5rem;
        background: var(--brand);
        color: #ffffff;
        font-size: 0.9375rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-512.png" alt="" />
    <h1>Sin conexión</h1>
    <p>
      Platlia necesita señal para trabajar: acá se maneja plata y pedidos reales,
      y no queremos mostrarte algo viejo como si fuera de ahora.
    </p>
    <button onclick="location.reload()">Reintentar</button>
  </body>
</html>
