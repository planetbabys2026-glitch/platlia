<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Platlia</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #171512;
        --fg: #ede7da;
        --muted: #c9c2af;
        --brand: #ff4e1f;
        --panel: #221f1c;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 900;
        color: var(--fg);
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.5;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.75rem 1.5rem;
        border: 1px solid var(--brand);
        border-radius: 0.5rem;
        background: var(--brand);
        color: #171512;
        font-size: 0.9375rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.1s ease;
      }
      button:active {
        transform: scale(0.97);
      }
    </style>
  </head>
  <body>
    <img src="/icon.png" alt="Platlia" />
    <h1>Sin conexión a internet</h1>
    <p>
      No pudimos cargar esta página. Revisá tu conexión wifi o los datos móviles
      y volvé a intentar.
    </p>
    <button onclick="location.reload()">Reintentar</button>
  </body>
</html>
